name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      # the Hermes normalizer test skips here; the maintainer runs it plus tests/e2e.py against real Hermes
      - run: python -m pytest tests -q
